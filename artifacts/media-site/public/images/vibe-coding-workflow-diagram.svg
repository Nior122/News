<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="vc-title vc-desc">
  <title id="vc-title">Four-step vibe coding workflow</title>
  <desc id="vc-desc">Four-step vibe coding workflow: describe the app, AI builds it, review the result, refine with feedback</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1000" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090F1E"/>
      <stop offset="55%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#0B2228"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="140" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#60A5FA"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1,1.5 L8.5,5 L1,8.5 Z" fill="#34D399"/>
    </marker>
  </defs>

  <!-- Outer background -->
  <rect x="0" y="0" width="1000" height="400" rx="20" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="998" height="398" rx="19" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Header label -->
  <rect x="392" y="22" width="216" height="28" rx="14" fill="#13203B" stroke="#2563EB" stroke-opacity="0.45"/>
  <text x="500" y="40" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#93C5FD">VIBE CODING WORKFLOW</text>

  <!-- Step 1 Card: Describe the app -->
  <g transform="translate(40, 74)">
    <rect width="200" height="202" rx="16" fill="#111C33" stroke="#3B82F6" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="16" fill="#1D4ED8" fill-opacity="0.3" stroke="#60A5FA" stroke-width="1.2"/>
    <text x="34" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#93C5FD">1</text>
    <!-- Chat prompt icon -->
    <rect x="78" y="54" width="44" height="34" rx="8" fill="#1E3A8A" fill-opacity="0.55" stroke="#60A5FA" stroke-width="1.6"/>
    <line x1="87" y1="67" x2="113" y2="67" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
    <line x1="87" y1="75" x2="105" y2="75" stroke="#93C5FD" stroke-width="2" stroke-linecap="round"/>
    <text x="100" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">Describe the app</text>
    <text x="100" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">Explain what you want</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">in plain English</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <line x1="246" y1="175" x2="273" y2="175" stroke="#60A5FA" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 2 Card: AI builds it -->
  <g transform="translate(280, 74)">
    <rect width="200" height="202" rx="16" fill="#111C33" stroke="#06B6D4" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="16" fill="#0E7490" fill-opacity="0.35" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="34" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7DD3FC">2</text>
    <!-- Code window icon -->
    <rect x="78" y="54" width="44" height="34" rx="8" fill="#164E63" fill-opacity="0.55" stroke="#38BDF8" stroke-width="1.6"/>
    <polyline points="93,66 87,71 93,76" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="107,66 113,71 107,76" fill="none" stroke="#BAE6FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">AI builds it</text>
    <text x="100" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">Generates the code</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">and working preview</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <line x1="486" y1="175" x2="513" y2="175" stroke="#60A5FA" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- Step 3 Card: Review the result -->
  <g transform="translate(520, 74)">
    <rect width="200" height="202" rx="16" fill="#0F212C" stroke="#10B981" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="16" fill="#047857" fill-opacity="0.35" stroke="#34D399" stroke-width="1.2"/>
    <text x="34" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6EE7B7">3</text>
    <!-- Check / test icon -->
    <rect x="78" y="54" width="44" height="34" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#34D399" stroke-width="1.6"/>
    <polyline points="91,71 98,77 110,65" fill="none" stroke="#A7F3D0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="100" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#F8FAFC">Review the result</text>
    <text x="100" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">Run the app, click around</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">and spot what breaks</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <line x1="726" y1="175" x2="753" y2="175" stroke="#34D399" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arrowGreen)"/>

  <!-- Step 4 Card: Refine with feedback -->
  <g transform="translate(760, 74)">
    <rect width="200" height="202" rx="16" fill="#0F212C" stroke="#34D399" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="16" fill="#047857" fill-opacity="0.35" stroke="#6EE7B7" stroke-width="1.2"/>
    <text x="34" y="39" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#A7F3D0">4</text>
    <!-- Sliders / iterate icon -->
    <rect x="78" y="54" width="44" height="34" rx="8" fill="#064E3B" fill-opacity="0.55" stroke="#6EE7B7" stroke-width="1.6"/>
    <line x1="88" y1="65" x2="112" y2="65" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="104" cy="65" r="3" fill="#34D399"/>
    <line x1="88" y1="76" x2="112" y2="76" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="95" cy="76" r="3" fill="#34D399"/>
    <text x="100" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">Refine with feedback</text>
    <text x="100" y="150" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">Ask for changes one</text>
    <text x="100" y="168" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#94A3B8">step at a time</text>
  </g>

  <!-- Feedback Loop Return Arrow (Step 4 -> Step 1) -->
  <path d="M 860 282 L 860 342 Q 860 356 846 356 L 154 356 Q 140 356 140 342 L 140 286" fill="none" stroke="url(#accentGrad)" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>

  <!-- Feedback loop badge -->
  <rect x="332" y="340" width="336" height="30" rx="15" fill="#0F172A" stroke="#34D399" stroke-opacity="0.55" stroke-width="1.3"/>
  <text x="500" y="359" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#A7F3D0">Loop until ready — then review &amp; publish</text>
</svg>
