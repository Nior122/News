kind = "mobile"
previewPath = "/mobile/"
title = "Scrolltek Mobile"
version = "1.0.0"
id = "artifacts/scrolltek-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20701

[services.development]
run = "pnpm --filter @workspace/scrolltek-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scrolltek-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/scrolltek-mobile", "run", "serve" ]

[services.env]
PORT = "20701"
BASE_PATH = "/mobile/"
