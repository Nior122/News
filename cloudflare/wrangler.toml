name = "scrolltek-api"
main = "worker.mjs"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

[vars]
# Set secrets via: wrangler secret put DATABASE_URL
# Set secrets via: wrangler secret put ADMIN_PASSWORD

[[routes]]
pattern = "scrolltek.pages.dev/api/*"
zone_name = "scrolltek.pages.dev"

# Local dev: wrangler dev --env dev
[env.dev]
vars = { NODE_ENV = "development" }
