kind = "web"
previewPath = "/"
title = "Media Website"
version = "1.0.0"
id = "artifacts/media-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23701

[services.development]
run = "pnpm --filter @workspace/media-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/media-site", "run", "build" ]
publicDir = "artifacts/media-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23701"
BASE_PATH = "/"
