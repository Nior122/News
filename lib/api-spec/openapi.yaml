openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for PulseWire media platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: articles
    description: Article operations
  - name: categories
    description: Category operations
  - name: newsletter
    description: Newsletter operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List articles
      description: Returns a paginated list of articles, optionally filtered by category
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"

  /articles/featured:
    get:
      operationId: getFeaturedArticle
      tags: [articles]
      summary: Get featured article
      description: Returns the single featured/hero article
      responses:
        "200":
          description: Featured article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"

  /articles/trending:
    get:
      operationId: listTrendingArticles
      tags: [articles]
      summary: List trending articles
      description: Returns top trending articles (by views)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        "200":
          description: Trending articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/popular:
    get:
      operationId: listPopularArticles
      tags: [articles]
      summary: List popular articles this week
      description: Returns most popular articles by view count this week
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 6
      responses:
        "200":
          description: Popular articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/editors-picks:
    get:
      operationId: listEditorsPicks
      tags: [articles]
      summary: List editor's picks
      description: Returns manually curated editor's picks
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 4
      responses:
        "200":
          description: Editor's picks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/ticker:
    get:
      operationId: listTickerHeadlines
      tags: [articles]
      summary: Ticker headlines
      description: Returns short headline list for the trending ticker
      responses:
        "200":
          description: Ticker headlines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TickerItem"

  /articles/search:
    get:
      operationId: searchArticles
      tags: [articles]
      summary: Search articles
      description: Full-text search across articles
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticleListResponse"

  /articles/{slug}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get article by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /articles/{slug}/related:
    get:
      operationId: listRelatedArticles
      tags: [articles]
      summary: List related articles
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Related articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /categories/{slug}/articles:
    get:
      operationId: listCategoryArticles
      tags: [categories]
      summary: Get articles by category spotlight (3-4 latest per category)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /newsletter/subscribe:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      summary: Subscribe to newsletter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsletterInput"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterResponse"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Article:
      type: object
      required:
        - id
        - slug
        - title
        - excerpt
        - category
        - author
        - publishedAt
        - readTime
        - imageUrl
        - views
        - featured
        - editorsPick
        - tags
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        excerpt:
          type: string
        body:
          type: ["string", "null"]
        category:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        publishedAt:
          type: string
        readTime:
          type: integer
        imageUrl:
          type: string
        views:
          type: integer
        featured:
          type: boolean
        editorsPick:
          type: boolean
        tags:
          type: array
          items:
            type: string

    Author:
      type: object
      required:
        - name
        - avatarUrl
      properties:
        name:
          type: string
        avatarUrl:
          type: string

    ArticleListResponse:
      type: object
      required:
        - articles
        - total
        - page
        - limit
        - hasMore
      properties:
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean

    Category:
      type: object
      required:
        - id
        - slug
        - name
        - color
        - articleCount
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        color:
          type: string
        articleCount:
          type: integer

    TickerItem:
      type: object
      required:
        - id
        - title
        - slug
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string

    NewsletterInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    NewsletterResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
